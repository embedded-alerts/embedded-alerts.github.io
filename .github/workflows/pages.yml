name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run site tests
        run: npm test
      - name: Build Astro site
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Astro dist artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Let any legacy branch build settle first
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          site="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(jq -r '.build_type // "legacy"' <<<"$site")"
          if [[ "$build_type" != legacy ]]; then
            echo "Pages source is already ${build_type}; no legacy build to wait for."
            exit 0
          fi

          for attempt in $(seq 1 90); do
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")"
            commit="$(jq -r '.commit // ""' <<<"$latest")"
            status="$(jq -r '.status // ""' <<<"$latest")"
            echo "legacy Pages build attempt=${attempt} commit=${commit} status=${status}"
            if [[ "$commit" == "$GITHUB_SHA" && "$status" == built ]]; then
              exit 0
            fi
            if [[ "$commit" == "$GITHUB_SHA" && "$status" == errored ]]; then
              echo "Legacy build errored; continuing so the custom Astro deployment can replace it."
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for the legacy Pages build for ${GITHUB_SHA}." >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: deploy
    steps:
      - name: Curl live Astro HTML and stylesheet
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/"
          test -n "$base"

          for attempt in $(seq 1 60); do
            cache_bust="${GITHUB_SHA}-${attempt}"
            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 2 \
              --connect-timeout 10 \
              --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "${base}?deploy=${cache_bust}" \
              -o site.html; then
              if grep -q 'Watch meaning move.' site.html \
                && grep -q 'data-astro-cid' site.html \
                && ! grep -q '<head></head>' site.html \
                && grep -Eq '<link[^>]+rel="stylesheet"[^>]+href="[^"]+\.css"' site.html; then
                css_path="$(grep -oE 'href="[^"]+\.css"' site.html | head -n 1 | cut -d'"' -f2)"
                css_url="$(python3 -c 'import sys; from urllib.parse import urljoin; print(urljoin(sys.argv[1], sys.argv[2]))' "$base" "$css_path")"
                curl \
                  --fail \
                  --silent \
                  --show-error \
                  --location \
                  --retry 2 \
                  --connect-timeout 10 \
                  --max-time 30 \
                  -H 'Cache-Control: no-cache' \
                  "${css_url}?deploy=${cache_bust}" \
                  -o site.css
                css_bytes="$(wc -c < site.css)"
                if (( css_bytes >= 1000 )) && grep -q '.page-shell' site.css; then
                  echo "Live Astro deployment verified: ${base}"
                  echo "Stylesheet verified: ${css_url} (${css_bytes} bytes)"
                  exit 0
                fi
              fi
            fi
            sleep 3
          done

          echo 'Live deployment did not converge to the expected styled Astro artifact.' >&2
          sed -n '1,60p' site.html >&2 || true
          exit 1
