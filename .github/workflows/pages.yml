name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Validate repository contract
        run: python3 scripts/verify_repo.py
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run site tests
        run: npm test
      - name: Build and verify Astro site
        run: npm run build
      - name: Upload Astro artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: deploy
    steps:
      - name: Verify deployed Astro HTML
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_MARKER: 'Watch meaning move.'
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "${base}?deploy=${GITHUB_SHA}-${attempt}" -o site.html \
              && grep -Fq "$EXPECTED_MARKER" site.html \
              && grep -Fq 'rel="canonical"' site.html \
              && grep -Fq 'rel="icon"' site.html; then
              echo "Live Astro deployment verified: ${base}"
              exit 0
            fi
            sleep 3
          done
          echo "Live site did not converge to the expected Astro artifact." >&2
          exit 1
